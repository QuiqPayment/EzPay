version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: ezpay-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ezpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ezpay-backend
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/ezpay
      PORT: 3001
      STELLAR_NETWORK: testnet
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      STELLAR_CONTRACT_ID: ${STELLAR_CONTRACT_ID:-}
      STELLAR_EVENT_START_LEDGER: ${STELLAR_EVENT_START_LEDGER:-}
      STELLAR_EVENT_POLL_INTERVAL_SECS: ${STELLAR_EVENT_POLL_INTERVAL_SECS:-3}
      RUST_LOG: info
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - cargo_cache:/usr/local/cargo/registry

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ezpay-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules

volumes:
  postgres_data:
  cargo_cache:
  node_modules:

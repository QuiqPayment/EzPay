# Authorized Protocol Quality Assurance & Formal Invariant Verification
version: '3.8'

services:
  ezpay-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ezpay-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgres://ezpay_user:ezpay_pass@ezpay-db:5432/ezpay_dev
      - REDIS_URL=redis://ezpay-redis:6379
    depends_on:
      ezpay-db:
        condition: service_healthy
      ezpay-redis:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  ezpay-db:
    image: postgres:15-alpine
    container_name: ezpay-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ezpay_user
      POSTGRES_PASSWORD: ezpay_pass
      POSTGRES_DB: ezpay_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezpay_user -d ezpay_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  ezpay-redis:
    image: redis:7-alpine
    container_name: ezpay-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
